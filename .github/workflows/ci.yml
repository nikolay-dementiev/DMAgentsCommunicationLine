name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Format lint
        run: swift format lint --strict --recursive Package.swift Sources Tests
